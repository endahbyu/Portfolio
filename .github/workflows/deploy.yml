name: Deploy

# Every push to main builds on this VPS (self-hosted runner) and swaps the live release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /var/www/portfolio
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: [self-hosted, portfolio]
    steps:
      - uses: actions/checkout@v4

      - name: Install & build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Assemble release
        run: |
          RELEASE="$APP_DIR/releases/${GITHUB_SHA::7}"
          rm -rf "$RELEASE" && mkdir -p "$RELEASE"
          cp -r .next/standalone/. "$RELEASE/"
          mkdir -p "$RELEASE/.next"
          cp -r .next/static "$RELEASE/.next/static"
          [ -d public ] && cp -r public "$RELEASE/public"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Switch & restart
        run: |
          PREV=$(readlink -f "$APP_DIR/current" || true)
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          ln -sfn "$RELEASE" "$APP_DIR/current"
          sudo systemctl restart portfolio

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:3000 && exit 0
            sleep 1
          done
          echo "Health check failed" && exit 1

      - name: Roll back on failure
        if: failure() && env.PREV != ''
        run: |
          ln -sfn "$PREV" "$APP_DIR/current"
          sudo systemctl restart portfolio

      - name: Prune old releases
        if: success()
        run: |
          cd "$APP_DIR/releases"
          ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf
